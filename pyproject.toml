[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorial-app"
version = "1.0.0"
description = "年忌管理 - Japanese Buddhist Memorial Anniversary Management Application"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "SQLAlchemy>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-docx>=1.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
pdf = [
    "docx2pdf>=0.10",
]

[project.scripts]
nenki = "memorial_app.app.main:main"

[tool.setuptools.packages.find]
where = ["nenki_app"]
include = ["memorial_app*"]
